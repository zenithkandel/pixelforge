<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play — PixelForge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/codes/pixelforge/assets/css/main.css">
  <link rel="stylesheet" href="/codes/pixelforge/assets/css/pages/play.css">
  <script src="https://zenithkandel.com.np/fontawesome/zenith-icons.js"></script>
</head>
<body>
  <div class="play-layout">
    <!-- Top bar -->
    <div class="play-topbar">
      <div class="play-topbar-left">
        <a href="/codes/pixelforge/home/" class="btn btn-ghost btn-sm">
          <i class="fa-duotone fa-light fa-arrow-left"></i>
          Home
        </a>
        <div class="play-stat">
          <span class="play-stat-label">Score</span>
          <span class="play-stat-value score" id="hudScore">0</span>
        </div>
        <div class="play-stat">
          <span class="play-stat-label">Target</span>
          <span class="play-stat-value" id="hudTarget" style="color: var(--text-muted);">500</span>
        </div>
        <div class="play-stat" id="hudGemsEarnedWrap" style="display: none;">
          <i class="fa-duotone fa-light fa-gem" style="color: var(--success);"></i>
          <span class="play-stat-value" id="hudGemsEarned" style="color: var(--success);">+0</span>
        </div>
      </div>
      <div class="play-topbar-right">
        <div class="play-stat">
          <span class="play-stat-label">Combo</span>
          <span class="play-stat-value" id="hudCombo">-</span>
        </div>
        <div class="play-stat">
          <span class="play-stat-label">Moves</span>
          <span class="play-stat-value moves" id="hudMoves">30</span>
        </div>
        <div class="play-stat">
          <i class="fa-duotone fa-light fa-gem"></i>
          <span class="play-stat-value" id="hudGems">0</span>
        </div>
      </div>
    </div>

    <!-- Game body -->
    <div class="play-body">
      <!-- Board area -->
      <div class="play-board-area">
        <div class="play-board-wrapper">
          <div class="play-combo" id="comboDisplay"></div>
          <canvas id="gameCanvas"></canvas>
        </div>
      </div>

      <!-- Booster sidebar -->
      <div class="play-boosters">
        <div class="play-boosters-title">Boosters</div>
        <div id="boosterList" class="stack-2">
          <!-- Populated by JS -->
        </div>
        <div class="play-actions">
          <button class="btn btn-danger btn-sm" id="quitBtn" style="width: 100%;">
            Quit Game
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Game Over Overlay -->
  <div class="play-gameover-overlay" id="gameOverOverlay">
    <div class="play-gameover-card">
      <div class="play-gameover-stars" id="gameOverStars"></div>
      <h2 class="play-gameover-title" id="gameOverTitle">Game Over</h2>
      <div class="play-gameover-score" id="finalScore">0</div>
      <div class="play-gameover-target" id="finalTarget"></div>
      <div class="play-gameover-stats">
        <div class="play-gameover-stat">
          <div class="play-gameover-stat-value" id="finalCombo">1x</div>
          <div class="play-gameover-stat-label">Max Combo</div>
        </div>
        <div class="play-gameover-stat">
          <div class="play-gameover-stat-value" id="finalGems" style="color: var(--accent);">+0</div>
          <div class="play-gameover-stat-label">Gems Earned</div>
        </div>
      </div>
      <div class="play-gameover-actions">
        <button class="btn btn-primary btn-lg" id="playAgainBtn" style="width: 100%;">Play Again</button>
        <a href="/codes/pixelforge/world/" class="btn btn-secondary btn-lg" style="width: 100%;">Open Canvas</a>
        <a href="/codes/pixelforge/home/" class="btn btn-ghost btn-sm">Back to Home</a>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Game Engine Scripts (order matters) -->
  <script src="/codes/pixelforge/assets/js/utils.js"></script>
  <script src="/codes/pixelforge/assets/js/game-animations.js"></script>
  <script src="/codes/pixelforge/assets/js/game-renderer.js"></script>
  <script src="/codes/pixelforge/assets/js/game.js"></script>
  <script src="/codes/pixelforge/assets/js/game-powerups.js"></script>
  <script src="/codes/pixelforge/assets/js/core/api.js"></script>
  <script src="/codes/pixelforge/assets/js/core/auth.js"></script>
  <script src="/codes/pixelforge/assets/js/core/events.js"></script>
  <script src="/codes/pixelforge/assets/js/components/toast.js"></script>

  <script>
    (function() {
      'use strict';

      var game, renderer, powerups;
      var sessionId = null;
      var maxCombo = 1;
      var scoreSubmitted = false;
      var SAVE_KEY = 'pixelforge_game_state';
      var QUIT_PENALTY = 100;

      // --- LocalStorage persistence ---
      function saveGameState() {
        if (!game || !sessionId) return;
        try {
          var state = {
            sessionId: sessionId,
            board: game.board.map(function(row) {
              return row.map(function(gem) {
                return gem ? { type: gem.type, special: gem.special || null } : null;
              });
            }),
            score: game.score,
            movesLeft: game.movesLeft,
            maxCombo: game.maxCombo,
            stats: game.stats
          };
          localStorage.setItem(SAVE_KEY, JSON.stringify(state));
        } catch (e) { /* quota or private browsing */ }
      }

      function loadGameState() {
        try {
          var raw = localStorage.getItem(SAVE_KEY);
          if (!raw) return null;
          var state = JSON.parse(raw);
          if (!state || !state.sessionId || !state.board) return null;
          return state;
        } catch (e) {
          return null;
        }
      }

      function clearGameState() {
        localStorage.removeItem(SAVE_KEY);
      }

      // --- Auth ---
      Auth.check().then(function(user) {
        if (!user) {
          window.location.href = '/codes/pixelforge/';
          return;
        }
        document.getElementById('hudGems').textContent = user.balance;
        startNewGame();
      });

      // --- Render loop ---
      function gameLoop(timestamp) {
        if (renderer) renderer.render(timestamp || 0);
        requestAnimationFrame(gameLoop);
      }

      // --- Start game ---
      async function startNewGame() {
        try {
          var saved = loadGameState();

          if (saved) {
            sessionId = saved.sessionId;
            maxCombo = saved.maxCombo;
            scoreSubmitted = false;

            game = new GemForge(8, 8, 6);
            game.loadState({
              board: saved.board,
              score: saved.score,
              movesLeft: saved.movesLeft,
              maxCombo: saved.maxCombo,
              stats: saved.stats
            });

            Toast.info('Game restored', 'Continuing from where you left off.');
          } else {
            var data = await API.get('game.php?action=start_game');
            sessionId = data.session_id;
            maxCombo = 1;
            scoreSubmitted = false;

            game = new GemForge(8, 8, 6);
            game.loadState({
              board: data.board,
              score: 0,
              movesLeft: data.moves_left,
              maxCombo: 0,
              stats: { gemsMatched: 0, specialsCreated: 0, boostsUsed: 0, highestCombo: 0 }
            });
          }

          renderer = new GameRenderer('gameCanvas', game);
          powerups = new PowerUpManager(game, renderer);

          setupGameEvents();
          setupUIEvents();
          updateHUD();
          powerups.loadBoosters();
          loadBoosters();
          hideGameOver();

          // Start render loop (only once)
          if (!window._gameLoopStarted) {
            window._gameLoopStarted = true;
            gameLoop();
          }
        } catch (err) {
          Toast.error('Failed to start game', err.message);
        }
      }

      // --- Game events → HUD ---
      function setupGameEvents() {
        game.events.on('select', function(pos) {
          renderer.selectedGem = pos;
        });

        game.events.on('deselect', function() {
          renderer.selectedGem = null;
        });

        game.events.on('match', function(data) {
          // Visual effects
          renderer.particles.spawnRemovalParticles(data.matches, renderer.gemSize);
          renderer.addScorePopup(data.score, renderer.canvas.width / 2, renderer.canvas.height / 2);

          if (data.combo > 1) {
            renderer.showCombo(data.combo);
            renderer.triggerShake(data.combo * 2);
            showComboBanner(data.combo);
          }

          // Update HUD from live game state
          updateHUD();
          saveGameState();
        });

        game.events.on('chainReaction', function(reactions) {
          reactions.forEach(function(r) {
            renderer.particles.spawnSpecialEffect(r.type, r.source.row, r.source.col, renderer.gemSize);
          });
          renderer.triggerShake(8);
        });

        game.events.on('stateChange', function() {
          updateHUD();
          saveGameState();
        });

        game.events.on('gameOver', async function(result) {
          clearGameState();
          await submitScore(result);
          showGameOver(result);
        });

        game.events.on('noMoves', function() {
          Toast.info('No moves available', 'The board will be shuffled.');
        });

        game.events.on('shuffle', function() {
          renderer.particles.clear();
        });

        // PowerUp events
        powerups.events.on('boostersUpdated', function() {
          loadBoosters();
        });

        powerups.events.on('boosterUsed', function() {
          updateHUD();
          loadBoosters();
        });
      }

      // --- Score targets based on level ---
      function getScoreTarget() {
        var user = Auth.getUser();
        var level = user ? user.level : 1;
        return 300 + (level - 1) * 200;
      }

      function getStars(score, target) {
        if (score >= target * 2) return 3;
        if (score >= target) return 2;
        if (score >= target * 0.5) return 1;
        return 0;
      }

      function getGemReward(score) {
        return Math.max(1, Math.min(50, Math.floor(score / 100)));
      }

      // --- Update HUD from game state ---
      function updateHUD() {
        var score = game.score;
        var target = getScoreTarget();
        var gems = getGemReward(score);

        document.getElementById('hudScore').textContent = score.toLocaleString();
        document.getElementById('hudMoves').textContent = game.movesLeft;
        document.getElementById('hudTarget').textContent = target.toLocaleString();

        var gemsEarnedWrap = document.getElementById('hudGemsEarnedWrap');
        var gemsEarnedEl = document.getElementById('hudGemsEarned');
        if (score > 0) {
          gemsEarnedWrap.style.display = '';
          gemsEarnedEl.textContent = '+' + gems;
        } else {
          gemsEarnedWrap.style.display = 'none';
        }

        // Score color: red if below 50% target, yellow if below target, green if at/above
        var scoreEl = document.getElementById('hudScore');
        if (score >= target) {
          scoreEl.style.color = 'var(--success)';
        } else if (score >= target * 0.5) {
          scoreEl.style.color = 'var(--warning)';
        } else {
          scoreEl.style.color = 'var(--text-primary)';
        }

        // Combo display
        var comboEl = document.getElementById('hudCombo');
        if (game.combo > 0) {
          comboEl.textContent = game.combo + 'x';
        } else {
          comboEl.textContent = '-';
        }

        // Moves color warning
        var movesEl = document.getElementById('hudMoves');
        if (game.movesLeft <= 5) {
          movesEl.style.color = 'var(--danger)';
        } else if (game.movesLeft <= 10) {
          movesEl.style.color = 'var(--warning)';
        } else {
          movesEl.style.color = 'var(--accent)';
        }
      }

      // --- Combo banner ---
      function showComboBanner(combo) {
        var el = document.getElementById('comboDisplay');
        el.textContent = combo + 'x COMBO!';
        el.classList.add('visible');
        setTimeout(function() { el.classList.remove('visible'); }, 800);
      }

      // --- UI button events ---
      function setupUIEvents() {
        document.getElementById('quitBtn').onclick = function() {
          if (game.isProcessing) return;
          var penaltyScore = Math.max(0, game.score - QUIT_PENALTY);
          var msg = 'Quit early? -' + QUIT_PENALTY + ' score penalty.\nYour score: ' + game.score + ' → ' + penaltyScore;
          if (confirm(msg)) {
            clearGameState();
            submitScore({ score: penaltyScore, maxCombo: game.maxCombo, stats: game.stats, penalized: true });
            showGameOver({ score: penaltyScore, maxCombo: game.maxCombo, penalized: true });
          }
        };

        document.getElementById('playAgainBtn').addEventListener('click', function() {
          clearGameState();
          hideGameOver();
          startNewGame();
        });

        // Booster clicks on canvas
        renderer.canvas.addEventListener('click', function(e) {
          if (!powerups || !powerups.activeBooster) return;
          var rect = renderer.canvas.getBoundingClientRect();
          var x = e.clientX - rect.left;
          var y = e.clientY - rect.top;
          var col = Math.floor(x / (renderer.gemSize + renderer.padding));
          var row = Math.floor(y / (renderer.gemSize + renderer.padding));
          if (row >= 0 && row < game.rows && col >= 0 && col < game.cols) {
            powerups.handleBoosterClick(row, col);
          }
        });
      }

      // --- Submit score ---
      async function submitScore(result) {
        if (!sessionId || scoreSubmitted) return;
        scoreSubmitted = true;
        try {
          var data = await API.post('game.php?action=submit_score', {
            session_id: sessionId,
            score: result.score,
            max_combo: result.maxCombo,
            penalized: !!result.penalized
          });

          // Update gems display
          if (data.success) {
            document.getElementById('hudGems').textContent = data.new_balance;
            if (Auth.getUser()) {
              Auth.getUser().balance = data.new_balance;
              Auth.getUser().xp = data.new_xp;
              Auth.getUser().level = data.new_level;
            }
          }
          sessionId = null;
        } catch (err) {
          if (err.status === 429) {
            Toast.warning('Submitted too fast', 'Please wait before submitting.');
          } else {
            Toast.error('Submit failed', err.message);
          }
        }
      }

      // --- Load boosters ---
      async function loadBoosters() {
        try {
          var data = await API.get('game.php?action=get_boosters');
          var list = document.getElementById('boosterList');
          var boosters = data.boosters;
          var boosterDefs = [
            { key: 'hint', name: 'Hint', icon: '\uD83D\uDCA1', desc: 'Show a valid move', cost: 10 },
            { key: 'hammer', name: 'Hammer', icon: '\uD83D\uDD28', desc: 'Destroy one gem', cost: 25 },
            { key: 'shuffle', name: 'Shuffle', icon: '\uD83D\uDD00', desc: 'Randomize board', cost: 40 },
            { key: 'extraMoves', name: '+5 Moves', icon: '\u26A1', desc: 'Add 5 moves', cost: 60 },
            { key: 'colorBurst', name: 'Color Burst', icon: '\uD83D\uDCA5', desc: 'Destroy all of one color', cost: 100 },
            { key: 'lightning', name: 'Lightning', icon: '\u26A1', desc: 'Clear row + column', cost: 150 },
          ];
          var userBalance = Auth.getUser() ? Auth.getUser().balance : 0;

          list.innerHTML = boosterDefs.map(function(b) {
            var count = boosters[b.key] || 0;
            if (count > 0) {
              return '<div class="booster-item" data-booster="' + b.key + '">' +
                '<div class="booster-icon">' + b.icon + '</div>' +
                '<div class="booster-info">' +
                  '<div class="booster-name">' + b.name + '</div>' +
                  '<div class="booster-count">' + count + ' available</div>' +
                '</div>' +
                '<button class="btn btn-primary btn-sm booster-use-btn" data-booster="' + b.key + '">Use</button>' +
              '</div>';
            } else {
              var canAfford = userBalance >= b.cost;
              return '<div class="booster-item booster-item-shop' + (canAfford ? '' : ' disabled') + '" data-booster="' + b.key + '">' +
                '<div class="booster-icon">' + b.icon + '</div>' +
                '<div class="booster-info">' +
                  '<div class="booster-name">' + b.name + '</div>' +
                  '<div class="booster-count booster-price"><i class="fa-duotone fa-light fa-gem"></i> ' + b.cost + '</div>' +
                '</div>' +
                '<button class="btn btn-secondary btn-sm booster-buy-btn" data-booster="' + b.key + '"' + (canAfford ? '' : ' disabled') + '>Buy</button>' +
              '</div>';
            }
          }).join('');

          list.querySelectorAll('.booster-use-btn').forEach(function(btn) {
            btn.addEventListener('click', function(e) {
              e.stopPropagation();
              useBooster(btn.dataset.booster);
            });
          });

          list.querySelectorAll('.booster-buy-btn').forEach(function(btn) {
            btn.addEventListener('click', function(e) {
              e.stopPropagation();
              buyBooster(btn.dataset.booster);
            });
          });
        } catch (e) {
          // silently fail
        }
      }

      async function buyBooster(type) {
        try {
          var data = await API.post('game.php?action=buy_booster', { booster_type: type });
          if (data.success) {
            if (Auth.getUser()) {
              Auth.getUser().balance = data.new_balance;
              document.getElementById('hudGems').textContent = data.new_balance;
            }
            if (data.boosters) {
              Object.keys(data.boosters).forEach(function(key) {
                if (powerups.boosters[key]) powerups.boosters[key].count = data.boosters[key];
              });
            }
            Toast.success('Purchased!', 'Booster added to your inventory.');
            loadBoosters();
          }
        } catch (err) {
          Toast.error('Purchase failed', err.message);
        }
      }

      async function useBooster(type) {
        if (game.isProcessing) return;
        try {
          if (type === 'hint') {
            await API.post('game.php?action=use_booster', { booster_type: type });
            renderer.showHint();
            powerups.loadBoosters();
            loadBoosters();
            return;
          }
          powerups.activateBooster(type);
          await API.post('game.php?action=use_booster', { booster_type: type });
          powerups.loadBoosters();
          loadBoosters();
        } catch (err) {
          Toast.error('Booster failed', err.message);
        }
      }

      // --- Game Over ---
      function showGameOver(result) {
        var target = getScoreTarget();
        var stars = getStars(result.score, target);
        var gems = getGemReward(result.score);

        document.getElementById('finalScore').textContent = result.score.toLocaleString();
        document.getElementById('finalCombo').textContent = result.maxCombo + 'x';
        document.getElementById('finalGems').textContent = '+' + gems;

        var targetEl = document.getElementById('finalTarget');
        if (result.penalized) {
          targetEl.innerHTML = '<span style="color: var(--danger);">-' + QUIT_PENALTY + ' quit penalty</span>';
        } else if (stars >= 2) {
          targetEl.innerHTML = '<span style="color: var(--success);">Target: ' + target.toLocaleString() + ' &mdash; Reached!</span>';
        } else {
          targetEl.innerHTML = 'Target: ' + target.toLocaleString();
        }

        var starsEl = document.getElementById('gameOverStars');
        starsEl.innerHTML = '';
        for (var i = 0; i < 3; i++) {
          var star = document.createElement('i');
          star.className = i < stars ? 'fa-solid fa-star game-star earned' : 'fa-solid fa-star game-star';
          starsEl.appendChild(star);
        }

        var title = document.getElementById('gameOverTitle');
        if (result.penalized) {
          title.textContent = 'Game Quit';
        } else if (stars === 3) {
          title.textContent = 'Perfect!';
        } else if (stars === 2) {
          title.textContent = 'Great Job!';
        } else if (stars === 1) {
          title.textContent = 'Not Bad!';
        } else {
          title.textContent = 'Game Over';
        }

        document.getElementById('gameOverOverlay').classList.add('active');
      }

      function hideGameOver() {
        document.getElementById('gameOverOverlay').classList.remove('active');
      }
    })();
  </script>
</body>
</html>
