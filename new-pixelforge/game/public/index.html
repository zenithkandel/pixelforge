<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOID BREAKER - Space Arcade Shooter</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="stars"></div>
    <div class="twinkling"></div>
    
    <div class="container">
        <div class="title-container">
            <h1 class="game-title">
                <span class="title-void">VOID</span>
                <span class="title-breaker">BREAKER</span>
            </h1>
            <p class="subtitle">Space Arcade Shooter</p>
        </div>
        
        <div class="menu">
            <button class="btn btn-primary btn-start" onclick="window.location.href='/game'">
                <span class="btn-text">START GAME</span>
                <span class="btn-glow"></span>
            </button>
            
            <div class="leaderboard-section">
                <h2 class="section-title">TOP PILOTS</h2>
                <div class="leaderboard" id="leaderboard">
                    <div class="loading">Loading scores...</div>
                </div>
            </div>
        </div>
        
        <div class="controls-info">
            <div class="control-item">
                <span class="key">↑↓←→</span>
                <span class="action">Move</span>
            </div>
            <div class="control-item">
                <span class="key">SPACE</span>
                <span class="action">Fire</span>
            </div>
        </div>
        
        <div class="features">
            <div class="feature">
                <span class="feature-icon">◆</span>
                <span>Wave-based combat</span>
            </div>
            <div class="feature">
                <span class="feature-icon">★</span>
                <span>Power-ups & upgrades</span>
            </div>
            <div class="feature">
                <span class="feature-icon">☠</span>
                <span>Boss battles</span>
            </div>
            <div class="feature">
                <span class="feature-icon">⚡</span>
                <span>Combo system</span>
            </div>
        </div>
    </div>
    
    <script>
        fetch('/api/scores')
            .then(r => r.json())
            .then(d => {
                if (d.ok && d.scores.length) {
                    const html = d.scores.slice(0, 10).map((s, i) => 
                        `<div class="score-row ${i < 3 ? 'top-three' : ''}">
                            <span class="rank">#${i + 1}</span>
                            <span class="player">${s.player}</span>
                            <span class="score">${s.score.toLocaleString()}</span>
                        </div>`
                    ).join('');
                    document.getElementById('leaderboard').innerHTML = html;
                } else {
                    document.getElementById('leaderboard').innerHTML = '<div class="no-scores">No scores yet</div>';
                }
            });
    </script>
</body>
</html>
