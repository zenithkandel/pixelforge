<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOID BREAKER - Playing</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="game-body">
    <div class="game-container">
        <div class="hud">
            <div class="hud-left">
                <div class="score-display">
                    <span class="label">SCORE</span>
                    <span class="value" id="score">0</span>
                </div>
                <div class="wave-display">
                    <span class="label">WAVE</span>
                    <span class="value" id="wave">1</span>
                </div>
            </div>
            <div class="hud-center">
                <div class="combo-display" id="combo">
                    <span class="combo-text"></span>
                </div>
            </div>
            <div class="hud-right">
                <div class="lives-display">
                    <span class="label">SHIELDS</span>
                    <div class="lives" id="lives">
                        <span class="life active">◆</span>
                        <span class="life active">◆</span>
                        <span class="life active">◆</span>
                    </div>
                </div>
            </div>
        </div>
        
        <canvas id="gameCanvas"></canvas>
        
        <div class="game-over-screen" id="gameOverScreen">
            <div class="game-over-content">
                <h1 class="game-over-title">GAME OVER</h1>
                <div class="final-score">
                    <span class="label">FINAL SCORE</span>
                    <span class="value" id="finalScore">0</span>
                </div>
                <div class="final-wave">
                    <span class="label">WAVE REACHED</span>
                    <span class="value" id="finalWave">1</span>
                </div>
                <div class="player-name-section">
                    <input type="text" id="playerName" class="player-input" placeholder="Enter your name" maxlength="20">
                    <button class="btn btn-submit" id="submitScore">SUBMIT SCORE</button>
                </div>
                <button class="btn btn-restart" onclick="location.reload()">PLAY AGAIN</button>
                <button class="btn btn-menu" onclick="window.location.href='/'">MAIN MENU</button>
            </div>
        </div>
        
        <div class="pause-overlay" id="pauseOverlay">
            <div class="pause-content">
                <h1>PAUSED</h1>
                <p>Press ESC to resume</p>
            </div>
        </div>
        
        <div class="start-screen" id="startScreen">
            <div class="start-content">
                <h1>VOID BREAKER</h1>
                <p class="instructions">
                    Pilot your ship through hostile space.<br>
                    Destroy enemies, collect power-ups,<br>
                    survive the boss waves!
                </p>
                <div class="controls-display">
                    <div class="control"><span class="key">↑↓←→</span> Move</div>
                    <div class="control"><span class="key">SPACE</span> Fire</div>
                    <div class="control"><span class="key">P / ESC</span> Pause</div>
                </div>
                <button class="btn btn-start-game" id="startGameBtn">PRESS SPACE TO START</button>
            </div>
        </div>
    </div>
    
    <script src="/js/game.js"></script>
</body>
</html>
