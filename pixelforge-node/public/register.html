<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - PixelForge</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="nav-logo">
        <span class="logo-icon">◈</span>
        <span class="logo-text">PIXEL<span class="accent">FORGE</span></span>
      </a>
      <div class="nav-links">
        <a href="/" class="nav-link">Home</a>
        <a href="/game.html" class="nav-link">PIXEL DASH</a>
        <a href="/canvas.html" class="nav-link">The Forge</a>
        <a href="/leaderboard.html" class="nav-link">Leaderboard</a>
      </div>
    </div>
  </nav>

  <main class="main-content" style="padding-top: 70px;">
    <div class="container" style="max-width: 400px; padding: 60px 20px;">
      <div class="card">
        <h1 style="font-family: var(--font-display); font-size: 20px; text-align: center; margin-bottom: 30px; color: var(--accent-primary);">SIGN UP</h1>
        
        <form id="registerForm" class="forms">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required minlength="3" maxlength="20" pattern="[a-zA-Z0-9_]+" autocomplete="username">
            <small style="color: var(--text-muted); font-size: 12px;">3-20 characters, letters, numbers, underscores</small>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
            <small style="color: var(--text-muted); font-size: 12px;">Minimum 8 characters</small>
          </div>
          <div id="errorMessage" class="form-error" style="display: none;"></div>
          <div id="successMessage" style="display: none; color: var(--accent-primary); text-align: center; margin-bottom: 15px;"></div>
          <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
            Create Account
          </button>
        </form>

        <p style="text-align: center; margin-top: 20px; color: var(--text-muted);">
          Already have an account? <a href="/login.html" style="color: var(--accent-primary);">Login</a>
        </p>
      </div>
    </div>
  </main>

  <script type="module" src="/assets/js/api.js"></script>
  <script type="module" src="/assets/js/auth.js"></script>
  <script type="module">
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('errorMessage');
      const successEl = document.getElementById('successMessage');
      errorEl.style.display = 'none';
      successEl.style.display = 'none';
      
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      const result = await pixelforge.auth.register(username, email, password);
      
      if (result.success) {
        if (result.needsVerification) {
          successEl.textContent = 'Account created! Check your email to verify, or login now.';
          successEl.style.display = 'block';
          document.getElementById('registerForm').reset();
          pixelforge.showToast('Account created! Logging you in...', 'success');
          setTimeout(() => window.location.href = '/login.html', 2000);
        } else {
          window.location.href = '/';
        }
      } else {
        errorEl.textContent = result.error || 'Registration failed';
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
