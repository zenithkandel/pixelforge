<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - PixelForge</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="nav-logo">
        <span class="logo-icon">◈</span>
        <span class="logo-text">PIXEL<span class="accent">FORGE</span></span>
      </a>
      <div class="nav-links">
        <a href="/" class="nav-link">Home</a>
        <a href="/game.html" class="nav-link">PIXEL DASH</a>
        <a href="/canvas.html" class="nav-link">The Forge</a>
        <a href="/leaderboard.html" class="nav-link">Leaderboard</a>
      </div>
    </div>
  </nav>

  <main class="main-content" style="padding-top: 70px;">
    <div class="container" style="max-width: 400px; padding: 60px 20px;">
      <div class="card">
        <h1 style="font-family: var(--font-display); font-size: 20px; text-align: center; margin-bottom: 30px; color: var(--accent-primary);">LOGIN</h1>
        
        <form id="loginForm" class="forms">
          <div class="form-group">
            <label for="username">Username or Email</label>
            <input type="text" id="username" name="username" required autocomplete="username">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
          </div>
          <div id="errorMessage" class="form-error" style="display: none;"></div>
          <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
            Login
          </button>
        </form>

        <p style="text-align: center; margin-top: 20px; color: var(--text-muted);">
          Don't have an account? <a href="/register.html" style="color: var(--accent-primary);">Sign up</a>
        </p>
      </div>
    </div>
  </main>

  <script type="module" src="/assets/js/api.js"></script>
  <script type="module" src="/assets/js/auth.js"></script>
  <script type="module">
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('errorMessage');
      errorEl.style.display = 'none';
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      
      const result = await pixelforge.auth.login(username, password);
      
      if (result.success) {
        pixelforge.showToast('Login successful!', 'success');
        window.location.href = '/';
      } else {
        errorEl.textContent = result.error || 'Login failed';
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
