<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - PixelForge</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
  <style>
    .profile-page { padding: 100px 20px 60px; }
    .profile-header { display: flex; align-items: center; gap: 30px; margin-bottom: 40px; }
    .profile-avatar { width: 100px; height: 100px; border-radius: 50%; background: var(--bg-tertiary); border: 3px solid var(--accent-primary); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 36px; color: var(--accent-primary); }
    .profile-info h1 { font-family: var(--font-display); font-size: 24px; margin-bottom: 10px; }
    .profile-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .profile-stat { background: var(--bg-card); border: 1px solid var(--border-primary); border-radius: var(--radius-lg); padding: 20px; text-align: center; }
    .profile-stat-value { font-family: var(--font-display); font-size: 24px; color: var(--accent-primary); }
    .profile-stat-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-top: 5px; }
    .achievements-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
    .achievement-card { background: var(--bg-card); border: 1px solid var(--border-primary); border-radius: var(--radius-md); padding: 15px; display: flex; gap: 15px; align-items: center; }
    .achievement-card.locked { opacity: 0.5; }
    .achievement-icon { font-size: 32px; }
    .achievement-info h4 { font-size: 14px; margin-bottom: 4px; }
    .achievement-info p { font-size: 12px; color: var(--text-muted); }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="nav-logo">
        <span class="logo-icon">◈</span>
        <span class="logo-text">PIXEL<span class="accent">FORGE</span></span>
      </a>
      <div class="nav-links">
        <a href="/" class="nav-link">Home</a>
        <a href="/game.html" class="nav-link">PIXEL DASH</a>
        <a href="/canvas.html" class="nav-link">The Forge</a>
        <a href="/leaderboard.html" class="nav-link">Leaderboard</a>
      </div>
      <div class="nav-auth" id="navAuth">
        <a href="/login.html" class="btn btn-outline">Login</a>
        <a href="/register.html" class="btn btn-primary">Sign Up</a>
      </div>
      <div class="nav-user hidden" id="navUser">
        <div class="pxl-balance">
          <span class="pxl-icon">◆</span>
          <span id="navBalance">0</span> PXL
        </div>
        <a href="/profile.html" class="user-avatar" id="navAvatar">?</a>
      </div>
    </div>
  </nav>

  <main class="main-content profile-page">
    <div class="container">
      <div class="profile-header">
        <div class="profile-avatar" id="profileAvatar">?</div>
        <div class="profile-info">
          <h1 id="profileUsername">Loading...</h1>
          <p style="color: var(--text-muted);">Joined <span id="profileJoined">-</span></p>
        </div>
      </div>

      <div class="profile-stats">
        <div class="profile-stat">
          <div class="profile-stat-value" id="statBalance">0</div>
          <div class="profile-stat-label">PXL Balance</div>
        </div>
        <div class="profile-stat">
          <div class="profile-stat-value" id="statHighScore">0</div>
          <div class="profile-stat-label">High Score</div>
        </div>
        <div class="profile-stat">
          <div class="profile-stat-value" id="statGames">0</div>
          <div class="profile-stat-label">Games Played</div>
        </div>
        <div class="profile-stat">
          <div class="profile-stat-value" id="statPixels">0</div>
          <div class="profile-stat-label">Weekly Pixels</div>
        </div>
      </div>

      <h2 class="section-title" style="text-align: left; margin-bottom: 20px;">Achievements</h2>
      <div class="achievements-grid" id="achievementsGrid">
        <p style="color: var(--text-muted);">Loading achievements...</p>
      </div>

      <div id="logoutSection" class="hidden" style="margin-top: 40px; text-align: center;">
        <button class="btn btn-outline" onclick="window.pixelforge.auth.logout()">Logout</button>
      </div>
    </div>
  </main>

  <script type="module" src="/assets/js/api.js"></script>
  <script type="module" src="/assets/js/auth.js"></script>
  <script>
    async function loadProfile() {
      const urlParams = new URLSearchParams(window.location.search);
      const usernameParam = urlParams.get('user');

      let userData;
      
      if (usernameParam) {
        const response = await window.pixelforge.api.get(`/user/${usernameParam}`);
        if (!response?.data) {
          window.location.href = '/';
          return;
        }
        userData = response.data;
      } else if (window.pixelforge.auth?.isLoggedIn) {
        const response = await window.pixelforge.api.get('/user/me');
        if (!response?.data) {
          window.location.href = '/login.html';
          return;
        }
        userData = response.data;
        document.getElementById('logoutSection').classList.remove('hidden');
      } else {
        window.location.href = '/login.html';
        return;
      }

      document.getElementById('profileAvatar').textContent = userData.username.charAt(0).toUpperCase();
      document.getElementById('profileUsername').textContent = userData.username;
      document.getElementById('profileJoined').textContent = new Date(userData.joinedAt).toLocaleDateString();
      document.getElementById('statBalance').textContent = (userData.pxlBalance || userData.pxl_balance || 0).toLocaleString();
      document.getElementById('statHighScore').textContent = (userData.highScore || userData.high_score || 0).toLocaleString();
      document.getElementById('statGames').textContent = (userData.gamesPlayed || userData.games_played || 0).toLocaleString();
      document.getElementById('statPixels').textContent = (userData.weeklyPixels || userData.weekly_pixels || 0).toLocaleString();

      const allAchievements = await window.pixelforge.api.get('/user/achievements/list');
      if (allAchievements?.data?.achievements) {
        const earnedCodes = new Set((userData.achievements || []).map(a => a.code));
        document.getElementById('achievementsGrid').innerHTML = allAchievements.data.achievements.map(ach => {
          const earned = earnedCodes.has(ach.code);
          return `
            <div class="achievement-card ${earned ? '' : 'locked'}">
              <span class="achievement-icon">${ach.icon || '🏆'}</span>
              <div class="achievement-info">
                <h4>${ach.name}</h4>
                <p>${ach.description}</p>
              </div>
            </div>
          `;
        }).join('');
      }
    }

    loadProfile();
  </script>
</body>
</html>
