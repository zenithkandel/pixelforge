<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelForge - Leaderboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/pixelforge/assets/css/main.css">
    <style>
        .leaderboard-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 100px 24px 48px;
        }
        .leaderboard-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .leaderboard-header h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .leaderboard-header p {
            color: #64748b;
            font-size: 14px;
        }
        .tab-bar {
            display: flex;
            gap: 4px;
            background: #12121a;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 24px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: #64748b;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 200ms;
        }
        .tab-btn.active {
            background: #7c3aed;
            color: white;
        }
        .tab-btn:hover:not(.active) {
            color: #e2e8f0;
        }
        .leaderboard-card {
            background: #12121a;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            overflow: hidden;
        }
        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
        }
        .leaderboard-table th {
            text-align: left;
            padding: 14px 20px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .leaderboard-table th:last-child {
            text-align: right;
        }
        .leaderboard-table td {
            padding: 14px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .leaderboard-table td:last-child {
            text-align: right;
        }
        .leaderboard-table tr:last-child td {
            border-bottom: none;
        }
        .leaderboard-table tr:hover td {
            background: rgba(255,255,255,0.02);
        }
        .rank-cell {
            font-weight: 700;
            width: 60px;
            font-size: 14px;
        }
        .rank-1 { color: #fbbf24; font-size: 18px; }
        .rank-2 { color: #94a3b8; }
        .rank-3 { color: #cd7f32; }
        .user-cell {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: white;
            flex-shrink: 0;
        }
        .user-name {
            font-weight: 600;
            color: #e2e8f0;
        }
        .value-cell {
            font-weight: 700;
            color: #fbbf24;
            font-size: 15px;
        }
        .current-user td {
            background: rgba(124, 58, 237, 0.08) !important;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
            font-size: 14px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }
        @media (max-width: 600px) {
            .tab-bar { flex-wrap: wrap; }
            .tab-btn { flex: none; width: calc(33.33% - 3px); font-size: 12px; }
            .leaderboard-table th:nth-child(3),
            .leaderboard-table td:nth-child(3) { display: none; }
        }
    </style>
</head>
<body>
    <nav class="site-nav">
        <a href="/pixelforge/" class="nav-logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 9L12 22L22 9L12 2Z"/>
            </svg>
            PixelForge
        </a>
        <div class="nav-links">
            <a href="/pixelforge/">Home</a>
            <a href="/pixelforge/game.html">Game</a>
            <a href="/pixelforge/canvas.html">Canvas</a>
            <a href="/pixelforge/leaderboard.html" class="active">Leaderboard</a>
        </div>
        <div class="nav-user">
            <span class="nav-balance">💎 <span id="nav-balance">0</span></span>
            <span class="nav-level">Lv.<span id="nav-level">1</span></span>
        </div>
    </nav>

    <main class="leaderboard-container">
        <div class="leaderboard-header">
            <h1>🏆 Leaderboard</h1>
            <p>Top players in the PixelForge community</p>
        </div>

        <div class="tab-bar">
            <button class="tab-btn active" data-tab="score">High Score</button>
            <button class="tab-btn" data-tab="pixels">Most Pixels</button>
            <button class="tab-btn" data-tab="level">Highest Level</button>
        </div>

        <div class="leaderboard-card">
            <div id="leaderboard-content">
                <div class="loading">Loading leaderboard...</div>
            </div>
        </div>
    </main>

    <script>
    (function() {
        'use strict';
        let currentTab = 'score';
        let currentUserId = null;

        document.querySelectorAll('.tab-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
                btn.classList.add('active');
                currentTab = btn.dataset.tab;
                loadLeaderboard();
            });
        });

        async function loadLeaderboard() {
            var content = document.getElementById('leaderboard-content');
            content.innerHTML = '<div class="loading">Loading...</div>';

            try {
                var res = await fetch('/pixelforge/api/auth.php?action=leaderboard&tab=' + currentTab);
                var data = await res.json();

                if (data.success && data.leaderboard.length > 0) {
                    renderLeaderboard(data.leaderboard);
                } else {
                    content.innerHTML = '<div class="empty-state">No players yet. Be the first!</div>';
                }
            } catch (err) {
                content.innerHTML = '<div class="empty-state">Failed to load leaderboard</div>';
            }
        }

        function renderLeaderboard(players) {
            var content = document.getElementById('leaderboard-content');
            var valueLabels = { score: 'Score', pixels: 'Pixels Placed', level: 'Level' };

            var html = '<table class="leaderboard-table">';
            html += '<thead><tr><th>Rank</th><th>Player</th><th>' + valueLabels[currentTab] + '</th></tr></thead>';
            html += '<tbody>';

            players.forEach(function(player, i) {
                var rank = i + 1;
                var rankClass = rank <= 3 ? ' rank-' + rank : '';
                var rankDisplay = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : '#' + rank;
                var isCurrent = player.id == currentUserId;
                var rowClass = isCurrent ? ' current-user' : '';

                html += '<tr class="' + rowClass + '">';
                html += '<td class="rank-cell' + rankClass + '">' + rankDisplay + '</td>';
                html += '<td><div class="user-cell">';
                html += '<div class="user-avatar" style="background:' + player.avatar_color + '">' + player.username.charAt(0).toUpperCase() + '</div>';
                html += '<span class="user-name">' + escapeHtml(player.username) + '</span>';
                html += '</div></td>';
                html += '<td class="value-cell">' + player.value.toLocaleString() + '</td>';
                html += '</tr>';
            });

            html += '</tbody></table>';
            content.innerHTML = html;
        }

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function loadUserData() {
            try {
                var res = await fetch('/pixelforge/api/auth.php?action=me');
                var data = await res.json();
                if (data.success) {
                    currentUserId = data.user.id;
                    document.getElementById('nav-balance').textContent = data.user.balance;
                    document.getElementById('nav-level').textContent = data.user.level;
                }
            } catch (err) {}
        }

        loadUserData();
        loadLeaderboard();
    })();
    </script>
</body>
</html>
