<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rankings — PixelForge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/codes/pixelforge/assets/css/main.css">
  <link rel="stylesheet" href="/codes/pixelforge/assets/css/pages/rankings.css">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar injected by Layout -->
    <main class="page" id="mainContent">
      <header class="page-header">
        <div class="page-header-inner">
          <div class="flex items-center gap-4">
            <button class="sidebar-toggle" id="sidebarToggle" aria-label="Open menu">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
            <div>
              <h1 class="page-title">Rankings</h1>
              <p class="page-subtitle">See who rules the territory</p>
            </div>
          </div>
        </div>
      </header>

      <div class="page-content container-narrow">
        <!-- Tabs -->
        <div class="tabs" id="rankingsTabs">
          <div class="tabs-list tabs-pills" role="tablist">
            <button class="tab active" role="tab" data-tab="score" aria-selected="true">High Score</button>
            <button class="tab" role="tab" data-tab="pixels" aria-selected="false">Most Pixels</button>
            <button class="tab" role="tab" data-tab="level" aria-selected="false">Highest Level</button>
          </div>

          <!-- Search -->
          <div class="rankings-search">
            <div class="form-search">
              <span class="search-icon">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="M9.5 9.5L13 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              </span>
              <input class="form-input" type="search" id="searchInput" placeholder="Search players..." aria-label="Search players">
            </div>
          </div>

          <!-- Podium (top 3) -->
          <div class="rankings-podium" id="podium" style="display: none;">
            <!-- Populated by JS -->
          </div>

          <!-- Rankings List -->
          <div class="rankings-list" id="rankingsList">
            <div class="stack-2" style="padding: var(--space-4);">
              <div class="skeleton skeleton-row"><div class="skeleton skeleton-avatar" style="width:32px;height:32px"></div><div style="flex:1"><div class="skeleton skeleton-text" style="width:60%"></div></div></div>
              <div class="skeleton skeleton-row"><div class="skeleton skeleton-avatar" style="width:32px;height:32px"></div><div style="flex:1"><div class="skeleton skeleton-text" style="width:55%"></div></div></div>
              <div class="skeleton skeleton-row"><div class="skeleton skeleton-avatar" style="width:32px;height:32px"></div><div style="flex:1"><div class="skeleton skeleton-text" style="width:65%"></div></div></div>
              <div class="skeleton skeleton-row"><div class="skeleton skeleton-avatar" style="width:32px;height:32px"></div><div style="flex:1"><div class="skeleton skeleton-text" style="width:50%"></div></div></div>
              <div class="skeleton skeleton-row"><div class="skeleton skeleton-avatar" style="width:32px;height:32px"></div><div style="flex:1"><div class="skeleton skeleton-text" style="width:70%"></div></div></div>
            </div>
          </div>

          <!-- Self rank -->
          <div class="rankings-self" id="selfRank" style="display: none;">
            <span class="rankings-self-label">Your rank</span>
            <span class="rankings-self-rank" id="selfRankValue">#—</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="/codes/pixelforge/assets/js/core/api.js"></script>
  <script src="/codes/pixelforge/assets/js/core/auth.js"></script>
  <script src="/codes/pixelforge/assets/js/core/events.js"></script>
  <script src="/codes/pixelforge/assets/js/components/toast.js"></script>
  <script src="/codes/pixelforge/assets/js/components/sidebar.js"></script>
  <script src="/codes/pixelforge/assets/js/components/layout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Layout.init('rankings');

      let currentTab = 'score';
      let allPlayers = [];
      let currentUser = null;

      // Tab switching
      document.querySelectorAll('.tab[data-tab]').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.tab[data-tab]').forEach(t => {
            t.classList.remove('active');
            t.setAttribute('aria-selected', 'false');
          });
          tab.classList.add('active');
          tab.setAttribute('aria-selected', 'true');
          currentTab = tab.dataset.tab;
          loadRankings();
        });
      });

      // Search
      document.getElementById('searchInput').addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase();
        const filtered = allPlayers.filter(p => p.username.toLowerCase().includes(q));
        renderList(filtered);
      });

      async function loadRankings() {
        try {
          const data = await API.get(`auth.php?action=leaderboard&tab=${currentTab}`);
          allPlayers = data.leaderboard || [];

          // Find current user
          currentUser = Auth.getUser();
          const selfIdx = allPlayers.findIndex(p => currentUser && p.id === currentUser.id);

          // Podium
          renderPodium(allPlayers.slice(0, 3));

          // List (skip top 3)
          renderList(allPlayers.slice(3), 4);

          // Self rank
          if (selfIdx >= 0) {
            document.getElementById('selfRank').style.display = 'flex';
            document.getElementById('selfRankValue').textContent = `#${selfIdx + 1}`;
          } else {
            document.getElementById('selfRank').style.display = 'none';
          }
        } catch (e) {
          Toast.error('Failed to load rankings', e.message);
        }
      }

      function renderPodium(top3) {
        const podium = document.getElementById('podium');
        if (top3.length === 0) {
          podium.style.display = 'none';
          return;
        }
        podium.style.display = 'grid';

        const medals = ['first', 'second', 'third'];
        const ranks = ['1st', '2nd', '3rd'];

        // Reorder: 2nd, 1st, 3rd for visual layout
        const order = top3.length >= 3 ? [1, 0, 2] : top3.map((_, i) => i);

        podium.innerHTML = order.map((i) => {
          const p = top3[i];
          if (!p) return '';
          return `
            <div class="rankings-podium-item ${medals[i]}">
              <div class="rankings-podium-rank">${ranks[i]}</div>
              <div class="avatar avatar-lg${i === 0 ? ' avatar-round' : ''}" style="background-color: ${p.avatar_color || 'var(--accent)'};">${p.username.charAt(0).toUpperCase()}</div>
              <div class="rankings-podium-name">${p.username}</div>
              <div class="rankings-podium-value">${p.value.toLocaleString()}</div>
            </div>
          `;
        }).join('');
      }

      function renderList(players, startRank = 1) {
        const list = document.getElementById('rankingsList');

        if (players.length === 0) {
          list.innerHTML = `
            <div style="text-align: center; padding: var(--space-8); color: var(--text-muted);">
              <p>No players found.</p>
            </div>
          `;
          return;
        }

        list.innerHTML = players.map((p, i) => {
          const rank = startRank + i;
          const isMe = currentUser && p.id === currentUser.id;
          const rankClass = rank <= 3 ? `top-${rank}` : '';
          return `
            <div class="ranking-row${isMe ? ' me' : ''}">
              <span class="ranking-rank ${rankClass}">${rank}</span>
              <div class="ranking-player">
                <div class="avatar avatar-sm" style="background-color: ${p.avatar_color || 'var(--accent)'};">${p.username.charAt(0).toUpperCase()}</div>
                <div>
                  <div class="ranking-name">${p.username}</div>
                </div>
              </div>
              <div class="ranking-value">${p.value.toLocaleString()}</div>
            </div>
          `;
        }).join('');
      }

      // Init
      Events.on('user:loaded', (user) => {
        currentUser = user;
        loadRankings();
      });
    });
  </script>
</body>
</html>
